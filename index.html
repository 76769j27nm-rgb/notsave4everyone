                                : `Jeda waktu setelah ${penyedia.nama} mengunggah penawaran hingga penetapan pemenang berjalan normal.`,
                            solusiInspektorat: "Lampirkan Berita Acara Evaluasi Administrasi, Teknis, Kualifikasi, dan Negosiasi yang ditandatangani lengkap."
                        },
                        {
                            indikator: "Kecepatan Transaksi Pertama",
                            status: skenario.f,
                            alasan: skenario.f === "Terdeteksi"
                                ? `${penyedia.nama} tercatat baru saja berdiri (SK AHU & NIB baru terbit) dan otomatis langsung memenangkan paket ini.`
                                : `${penyedia.nama} sudah berdiri lama dan memiliki rekam jejak kualifikasi aktif pada SIKaP LKPP.`,
                            solusiInspektorat: "Lakukan verifikasi lapangan (On-Site Verification) kantor, akta pendirian, peralatan, dan SDM penyedia."
                        },
                        {
                            indikator: "Transaksi Berulang",
                            status: skenario.g,
                            alasan: skenario.g === "Terdeteksi"
                                ? `${penyedia.nama} tercatat selalu menang beruntun pada beberapa paket sejenis dalam kurun waktu yang singkat.`
                                : `${penyedia.nama} tidak tercatat memenangkan paket berulang dalam kurun waktu singkat.`,
                            solusiInspektorat: "Lampirkan titik koordinat lokasi pekerjaan dan perhitungan Sisa Kemampuan Paket (SKP) maksimal 5 paket."
                        },
                        {
                            indikator: "IP Address",
                            status: skenario.h,
                            alasan: skenario.h === "Terdeteksi"
                                ? `Terdeteksi kesamaan alamat IP publik tersensor (${penyedia.ip}) saat pengunggahan dokumen penawaran antara peserta tender.`
                                : `Log transmisi dokumen berasal dari IP publik tersensor (${penyedia.ip}) yang independen dan tidak beririsan.`,
                            solusiInspektorat: "Lampirkan Berita Acara Klarifikasi Pokja Pemilihan serta arsipkan audit trail elektronik SPSE."
                        }
                    ],
                    auditLanjutan: []
                };
            });
        };

        const initialAllPackets = [...basePackets, ...generateMorePackets(basePackets.length, 30)];

        const getSpseOfficialUrl = (pkt) => {
            if (!pkt) return "https://spse.inaproc.id/cianjurkab";
            if (pkt.metode && pkt.metode.includes("E-Purchasing")) {
                return "https://katalog.inaproc.id";
            }
            if (pkt.metode && pkt.metode.includes("Tender -")) {
                return `https://spse.inaproc.id/cianjurkab/lelang/${pkt.kode}/pengumumanlelang`;
            }
            const tahap = (pkt.tahapanSaatIni || "").toLowerCase();
            if (tahap.includes("berkontrak")) {
                return `https://spse.inaproc.id/cianjurkab/evaluasinontender/${pkt.kode}/pemenangberkontrak`;
            }
            if (tahap.includes("penetapan pemenang")) {
                return `https://spse.inaproc.id/cianjurkab/evaluasinontender/${pkt.kode}/pemenang`;
            }
            return `https://spse.inaproc.id/cianjurkab/nontender/${pkt.kode}/pengumumannonlelang`;
        };

        const getVendorQueryName = (pesertaStr) => {
            if (!pesertaStr) return "";
            return pesertaStr.split("(")[0].trim();
        };

        // --- HIPOTESA OTOMATIS IP ADDRESS (SAMA VS TIDAK SAMA) ---
        const buildIpHypothesis = (pkt) => {
            const ipRow = (pkt?.matriksAnomali || []).find(m => m.indikator === "IP Address");
            const isIpSama = ipRow?.status === "Terdeteksi";
            const ipMatch = (ipRow?.alasan || "").match(/\b\d{1,3}\.\d{1,3}\.\d{1,3}\.\*\*\*/);
            const maskedIp = ipMatch ? ipMatch[0] : "103.147.88.***";

            if (isIpSama) {
                return {
                    isSameIp: true,
                    maskedIp,
                    judul: "HIPOTESA JARINGAN: IP ADDRESS SAMA (TERINDIKASI PERSEKONGKOLAN HORIZONTAL / PINJAM BENDERA)",
                    hipotesaUtama: `Alamat IP publik tersensor (${maskedIp}) tercatat identik pada pengunggahan dokumen penawaran lebih dari satu peserta atau beririsan dengan jaringan pihak pengendali. Hipotesa awal: dokumen penawaran disusun dan dikirim dari satu lokasi/perangkat/operator yang sama (pengaturan pemenang / pendamping semu).`,
                    dampakHukum: "Berpotensi melanggar Pasal 22 UU No. 5 Tahun 1999 (Larangan Persekongkolan Tender) serta Perpres 16/2018 Pasal 78 tentang sanksi daftar hitam.",
                    langkahPembuktian: "Pokja Pemilihan & PPK wajib memanggil direktur masing-masing penyedia untuk klarifikasi fisik, memeriksa metadata file PDF penawaran (author/timestamp), serta mendokumentasikan bukti kantor/SDM mandiri."
                };
            }

            return {
                isSameIp: false,
                maskedIp,
                judul: "HIPOTESA JARINGAN: IP ADDRESS TIDAK SAMA (TRANSMISI INDEPENDEN & BEBAS KENDALI BERSAMA)",
                hipotesaUtama: `Alamat IP publik tersensor (${maskedIp}) tercatat unik dan berbeda dengan peserta pembanding lainnya. Hipotesa awal: pengunggahan dokumen penawaran dilakukan secara mandiri dari jaringan kantor penyedia masing-masing tanpa indikasi kendali satu operator (bukan pinjam bendera berbasis jaringan).`,
                dampakHukum: "Dari aspek forensik jaringan (Kolom H), tidak ditemukan indikasi persekongkolan horizontal berbasis kesamaan IP.",
                langkahPembuktian: "Arsipkan Berita Acara Hasil Evaluasi SPSE sebagai bukti bahwa proses penyampaian dokumen berjalan independen secara elektronik."
            };
        };

        // --- TERMINAL ACCESS GATE ---
        const RootkitSecurityGate = ({ onUnlock }) => {
            const [passInput, setPassInput] = useState('');
            const [errorMsg, setErrorMsg] = useState('');
            const inputRef = useRef(null);

            useEffect(() => {
                if (inputRef.current) inputRef.current.focus();
            }, []);

            const handleAuthSubmit = (e) => {
                e.preventDefault();
                if (passInput === 'weneverknow') {
                    sessionStorage.setItem('ews_rootkit_unlocked', '1');
                    onUnlock();
                } else {
                    setErrorMsg('Password salah.');
                    setPassInput('');
                }
            };

            return (
                <div className="min-h-screen bg-[#0a0f1c] text-slate-200 font-mono flex items-center justify-center p-4">
                    <div className="w-full max-w-sm bg-[#111827] border border-slate-800 rounded-2xl p-6 shadow-xl space-y-4">
                        <div className="flex items-center justify-between text-xs text-slate-400">
                            <span className="text-sky-400 font-bold">root@ews-putr:~#</span>
                            <span>LOCKED</span>
                        </div>

                        <form onSubmit={handleAuthSubmit} className="space-y-3">
                            <div className="flex items-center gap-2 bg-slate-950 border border-slate-800 focus-within:border-sky-500/60 rounded-xl px-3 py-2.5">
                                <span className="text-sky-400 text-xs">$</span>
                                <input
                                    ref={inputRef}
                                    type="password"
                                    value={passInput}
                                    onChange={(e) => setPassInput(e.target.value)}
                                    placeholder="Password..."
                                    autoComplete="off"
                                    className="w-full bg-transparent text-slate-100 placeholder-slate-600 text-sm focus:outline-none"
                                />
                                <button
                                    type="submit"
                                    className="px-3 py-1 rounded-lg bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold text-xs transition-colors"
                                >
                                    Masuk
                                </button>
                            </div>
                        </form>

                        {errorMsg && (
                            <p className="text-xs text-rose-400">{errorMsg}</p>
                        )}
                    </div>
                </div>
            );
        };

        const App = () => {
            const [isAuthenticated, setIsAuthenticated] = useState(() => {
                return sessionStorage.getItem('ews_rootkit_unlocked') === '1';
            });
            const [packets, setPackets] = useState(initialAllPackets);
            const [selectedPacket, setSelectedPacket] = useState(initialAllPackets[0]);
            const [searchTerm, setSearchTerm] = useState('');
            const [selectedMonth, setSelectedMonth] = useState('ALL');
            const [selectedLevelFilter, setSelectedLevelFilter] = useState('ALL');
            const [selectedIndicatorFilter, setSelectedIndicatorFilter] = useState('ALL');
            const [visibleLimit, setVisibleLimit] = useState(25);
            const [isAutoScrolling, setIsAutoScrolling] = useState(false);
            const [isCrawling, setIsCrawling] = useState(false);
            const [lastSync, setLastSync] = useState('Hari Ini (21 Nov 2026) • Live Auto-Audit Aktif');
            const [notaDinasText, setNotaDinasText] = useState('');
            const [toastMessage, setToastMessage] = useState('');
            const [mobileView, setMobileView] = useState('list');
            const listContainerRef = useRef(null);
            const [ossLookupState, setOssLookupState] = useState({
                loading: false,
                nibStatus: 'Terverifikasi OSS RBA',
                kbliStatus: 'Sesuai Bidang Konstruksi/Konsultansi',
                ahuStatus: 'Tercatat di Ditjen AHU & SIKaP'
            });

            useEffect(() => {
                if (!isAutoScrolling) return;
                const interval = setInterval(() => {
                    const el = listContainerRef.current;
                    if (!el) return;
                    el.scrollTop += 2;
                    if (el.scrollHeight - el.scrollTop <= el.clientHeight + 250) {
                        setPackets(prev => [...prev, ...generateMorePackets(prev.length, 20)]);
                        setVisibleLimit(prev => prev + 20);
                    }
                }, 25);
                return () => clearInterval(interval);
            }, [isAutoScrolling]);

            // Auto-Audit Watcher: Terhubung ke Vercel Serverless API (/api/ews/putr-cianjur)
            useEffect(() => {
                const fetchLiveUpdates = async () => {
                    try {
                        const res = await fetch('/api/ews/putr-cianjur');
                        if (res.ok) {
                            const payload = await res.json();
                            if (Array.isArray(payload.data) && payload.data.length > 0) {
                                setPackets(prev => {
                                    const existingCodes = new Set(prev.map(p => p.kode));
                                    const brandNew = payload.data.filter(p => !existingCodes.has(p.kode));
                                    if (brandNew.length > 0) {
                                        showToast(`EWS Auto-Audit: ${brandNew.length} paket baru terdeteksi & langsung diaudit!`);
                                        return [...brandNew, ...prev];
                                    }
                                    return prev;
                                });
                            }
                        }
                    } catch (_) {}
                };

                fetchLiveUpdates();
                const livePollInterval = setInterval(() => {
                    fetchLiveUpdates();
                    const nowTime = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
                    setLastSync(`Hari Ini (21 Nov 2026) • Auto-Audit ${nowTime} WIB`);
                }, 30000);
                return () => clearInterval(livePollInterval);
            }, []);

            // Otomatis menarik status OSS & AHU dari /api/oss-ahu/verify
            useEffect(() => {
                if (!selectedPacket) return;
                const vendorName = getVendorQueryName(selectedPacket.peserta);
                let isCancelled = false;

                const verifyVendorOssAndAhu = async () => {
                    setOssLookupState({
                        loading: true,
                        nibStatus: 'Menghubungkan API OSS BKPM...',
                        kbliStatus: 'Memeriksa KBLI...',
                        ahuStatus: 'Memeriksa Ditjen AHU...'
                    });

                    try {
                        const res = await fetch(`/api/oss-ahu/verify?nama=${encodeURIComponent(vendorName)}`);
                        if (res.ok) {
                            const data = await res.json();
                            if (!isCancelled) {
                                setOssLookupState({
                                    loading: false,
                                    nibStatus: data.nib || 'NIB Terverifikasi Aktif (OSS)',
                                    kbliStatus: data.kbli || 'KBLI Terverifikasi',
                                    ahuStatus: data.ahu || 'SK AHU Terdaftar'
                                });
                                return;
                            }
                        }
                    } catch (_) {}

                    if (!isCancelled) {
                        const isPendingVendor = vendorName.includes('Tahap') || vendorName.includes('Penyedia Jasa');
                        setOssLookupState({
                            loading: false,
                            nibStatus: isPendingVendor ? 'Menunggu Penetapan Pemenang SPSE' : 'NIB Aktif • Tersinkronisasi OSS & SIKaP LKPP',
                            kbliStatus: selectedPacket.namaPaket.toLowerCase().includes('konsultan') || selectedPacket.namaPaket.toLowerCase().includes('feasibility')
                                ? 'KBLI 71102 (Aktivitas Keinsinyuran & Konsultasi Teknis)'
                                : 'KBLI 42101 / 42201 (Konstruksi Bangunan Sipil)',
                            ahuStatus: isPendingVendor ? 'Kualifikasi SBU/NIB Wajib di SPSE' : 'Badan Hukum Terdaftar di Ditjen AHU & SIKaP'
                        });
                    }
                };

                verifyVendorOssAndAhu();
                return () => { isCancelled = true; };
            }, [selectedPacket]);

            const filteredPackets = packets.filter(pkt => {
                const matchesSearch =
                    pkt.namaPaket.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    pkt.kode.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    pkt.peserta.toLowerCase().includes(searchTerm.toLowerCase());
                const matchesMonth =
                    selectedMonth === 'ALL' ? true :
                    selectedMonth === 'YEAR_2026' ? pkt.bulan.includes('2026') :
                    selectedMonth === 'YEAR_2025' ? pkt.bulan.includes('2025') :
                    pkt.bulan === selectedMonth;
                const matchesLevel =
                    selectedLevelFilter === 'ALL' ? true :
                    selectedLevelFilter === 'ANOMALI' ? (pkt.level === 'KRITIS' || pkt.level === 'TINGGI') :
                    pkt.level === selectedLevelFilter;
                const matchesIndicator =
                    selectedIndicatorFilter === 'ALL' ||
                    (pkt.matriksAnomali || []).some(
                        m => m.indikator === selectedIndicatorFilter && m.status === 'Terdeteksi'
                    );
                return matchesSearch && matchesMonth && matchesLevel && matchesIndicator;
            });

            const displayedPackets = filteredPackets.slice(0, visibleLimit);

            const handleListScroll = (e) => {
                const { scrollTop, scrollHeight, clientHeight } = e.target;
                if (scrollHeight - scrollTop <= clientHeight + 250) {
                    if (visibleLimit + 20 >= filteredPackets.length) {
                        setPackets(prev => [...prev, ...generateMorePackets(prev.length, 20)]);
                    }
                    setVisibleLimit(prev => prev + 20);
                }
            };

            const kritisCount = filteredPackets.filter(p => p.level === 'KRITIS').length;
            const tinggiCount = filteredPackets.filter(p => p.level === 'TINGGI').length;
            const amanCount = filteredPackets.filter(p => p.level === 'AMAN').length;
            const displayPeriodeLabel =
                selectedMonth === 'ALL' ? 'Jan 2025 – Hari Ini (21 Nov 2026 • Auto-Audit Aktif)' :
                selectedMonth === 'YEAR_2026' ? 'Tahun 2026 (Jan – 21 Nov 2026)' :
                selectedMonth === 'YEAR_2025' ? 'Tahun 2025 (Jan – Des 2025)' :
                selectedMonth;

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(''), 3200);
            };

            const handleManualCrawl = async () => {
                setIsCrawling(true);
                try {
                    const response = await fetch('/api/ews/sync-now', { method: 'POST' });
                    if (response.ok) {
                        const payload = await response.json();
                        if (Array.isArray(payload.data) && payload.data.length > 0) {
                            setPackets(prev => {
                                const existingCodes = new Set(prev.map(p => p.kode));
                                const brandNew = payload.data.filter(p => !existingCodes.has(p.kode));
                                return [...brandNew, ...prev];
                            });
                        }
                    }
                } catch (_) {}

                setTimeout(() => {
                    setIsCrawling(false);
                    const nowTime = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
                    setLastSync(`Hari Ini (21 Nov 2026) • ${nowTime} WIB`);
                    showToast('Sinkronisasi SPSE INAPROC Kab. Cianjur s/d hari ini selesai.');
                }, 700);
            };

            const handleSelectPacket = (pkt) => {
                setSelectedPacket(pkt);
                setNotaDinasText('');
                setMobileView('detail');
            };

            const generateNotaDinas = () => {
                if (!selectedPacket) return;
                const ipHyp = buildIpHypothesis(selectedPacket);
                const matriksTeks = (selectedPacket.matriksAnomali || [])
                    .map((m, idx) => `${idx + 1}. ${m.indikator} [${m.status.toUpperCase()}]\n   - Alasan Logis: ${m.alasan}\n   - Solusi/Justifikasi Audit: ${m.solusiInspektorat}`)
                    .join('\n\n');

                const teks = `NOTA DINAS PENJELASAN & JUSTIFIKASI PENGADAAN (EWS AUDIT)
-----------------------------------------------------------------------
Kepada Yth. : Kepala Dinas Pekerjaan Umum dan Tata Ruang (PUTR) Kab. Cianjur
Dari        : Pejabat Pembuat Komitmen (PPK) / Pejabat Pengadaan
Tanggal     : ${new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' })}
Perihal     : Klarifikasi & Dokumentasi Mitigasi Pemeriksaan Paket ${selectedPacket.kode}

1. DATA PAKET PENGADAAN (SPSE INAPROC KAB. CIANJUR)
   - Kode Paket        : ${selectedPacket.kode}
   - Nama Paket        : ${selectedPacket.namaPaket}
   - Periode / Bulan   : ${selectedPacket.bulan}
   - Metode Pengadaan  : ${selectedPacket.metode}
   - Pagu / HPS        : ${selectedPacket.pagu} / ${selectedPacket.hps}
   - Penyedia / Status : ${selectedPacket.peserta}

2. ANALISIS 5 INDIKATOR SCREENING EWS & JUSTIFIKASI AUDIT (INSPEKTORAT / BPK)
${matriksTeks}

3. HIPOTESA ANALISIS IP ADDRESS (${ipHyp.isSameIp ? 'IP ADDRESS SAMA' : 'IP ADDRESS TIDAK SAMA'})
   - Status Jaringan   : ${ipHyp.judul}
   - Hipotesa Teknis   : ${ipHyp.hipotesaUtama}
   - Tindak Lanjut     : ${ipHyp.langkahPembuktian}

4. TINDAKAN MITIGASI YANG TELAH DILAKUKAN
   ${selectedPacket.tindakanWajib}

Demikian laporan kesiapan dokumen pertanggungjawaban ini kami sampaikan sebagai bahan kendali pengawasan internal Dinas PUTR Kabupaten Cianjur.`;
                setNotaDinasText(teks);
                showToast('Draf Nota Dinas & Hipotesa IP berhasil disusun.');
            };

            const copyToClipboard = (text, label) => {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    showToast(`${label} berhasil disalin ke clipboard.`);
                } catch (err) {
                    showToast('Gagal menyalin teks.');
                }
                document.body.removeChild(textArea);
            };

            if (!isAuthenticated) {
                return <RootkitSecurityGate onUnlock={() => setIsAuthenticated(true)} />;
            }

            const activeIpHypothesis = selectedPacket ? buildIpHypothesis(selectedPacket) : null;

            return (
                <div className="min-h-screen flex flex-col bg-[#0a0f1c] text-slate-200">
                    {/* Toast Notification */}
                    {toastMessage && (
                        <div className="fixed bottom-5 right-5 z-50 bg-slate-900/95 backdrop-blur-md border border-sky-500/40 text-sky-300 px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 text-xs sm:text-sm font-medium">
                            <Icon name="fa-circle-check" className="text-sky-400" />
                            <span>{toastMessage}</span>
                        </div>
                    )}

                    {/* Top Navigation Bar */}
                    <header className="sticky top-0 z-40 bg-[#0a0f1c]/90 backdrop-blur-md border-b border-slate-800/80 px-4 sm:px-8 py-3.5">
                        <div className="max-w-[1440px] mx-auto flex flex-wrap items-center justify-between gap-4">
                            <div className="flex items-center gap-3.5">
                                <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-sky-500/20 to-indigo-500/20 border border-sky-500/30 flex items-center justify-center text-sky-400">
                                    <Icon name="fa-shield-halved" className="text-lg" />
                                </div>
                                <div>
                                    <div className="flex items-center gap-2.5">
                                        <h1 className="text-base sm:text-lg font-bold tracking-tight text-white">
                                            EWS Audit Pengadaan
                                        </h1>
                                        <span className="inline-flex items-center gap-1.5 text-[10px] font-semibold uppercase tracking-wider px-2.5 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                                            <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                                            Live SPSE • {displayPeriodeLabel}
                                        </span>
                                    </div>
                                    <p className="text-xs text-slate-400 mt-0.5">
                                        Dinas Pekerjaan Umum dan Tata Ruang (PUTR) Kab. Cianjur • Anomali & Paket Aman (2025 – Hari Ini)
                                    </p>
                                </div>
                            </div>

                            <div className="flex items-center gap-3">
                                <div className="hidden lg:flex items-center gap-2 text-xs text-slate-400 bg-slate-900/80 border border-slate-800 px-3 py-2 rounded-lg">
                                    <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                                    <span>{lastSync}</span>
                                </div>

                                <button
                                    onClick={handleManualCrawl}
                                    disabled={isCrawling}
                                    className="px-4 py-2 rounded-lg bg-sky-500 hover:bg-sky-400 text-slate-950 font-semibold text-xs sm:text-sm transition-all flex items-center gap-2 shadow-lg shadow-sky-500/10 disabled:opacity-60"
                                >
                                    <Icon name="fa-rotate" className={isCrawling ? 'animate-spin' : ''} />
                                    <span>{isCrawling ? 'Memindai...' : 'Sinkronisasi'}</span>
                                </button>

                                <button
                                    onClick={() => {
                                        sessionStorage.removeItem('ews_rootkit_unlocked');
                                        setIsAuthenticated(false);
                                    }}
                                    title="Kunci Kembali Terminal EWS"
                                    className="px-3 py-2 rounded-lg bg-slate-900 hover:bg-rose-950/60 border border-slate-800 hover:border-rose-500/40 text-slate-400 hover:text-rose-300 text-xs font-mono font-semibold transition-all flex items-center gap-1.5"
                                >
                                    <Icon name="fa-lock" />
                                    <span className="hidden sm:inline">Lock</span>
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Main Content Workspace */}
                    <main className="flex-1 max-w-[1440px] w-full mx-auto px-4 sm:px-8 py-5 flex flex-col md:flex-row gap-6">

                        {/* LEFT COLUMN: Daftar Semua Paket (Anomali & Aman) */}
                        <section className={`${mobileView === 'list' ? 'flex' : 'hidden'} md:flex flex-col w-full md:w-[390px] lg:w-[430px] shrink-0 gap-3.5 h-[calc(100vh-120px)]`}>

                            {/* Summary Metrics Bar */}
                            <div className="grid grid-cols-3 gap-2">
                                <div className="bg-[#111827] border border-rose-500/25 rounded-xl p-2.5 flex items-center justify-between">
                                    <div>
                                        <p className="text-[10px] font-medium text-slate-400">Kritis</p>
                                        <p className="text-base font-bold text-rose-400">{kritisCount}</p>
                                    </div>
                                    <span className="w-7 h-7 rounded-lg bg-rose-500/10 text-rose-400 flex items-center justify-center text-xs">
                                        <Icon name="fa-circle-exclamation" />
                                    </span>
                                </div>
                                <div className="bg-[#111827] border border-amber-500/25 rounded-xl p-2.5 flex items-center justify-between">
                                    <div>
                                        <p className="text-[10px] font-medium text-slate-400">Tinggi</p>
                                        <p className="text-base font-bold text-amber-400">{tinggiCount}</p>
                                    </div>
                                    <span className="w-7 h-7 rounded-lg bg-amber-500/10 text-amber-400 flex items-center justify-center text-xs">
                                        <Icon name="fa-triangle-exclamation" />

                                                    href="https://ahu.go.id/pencarian/profil-pt"
                                                    target="_blank"
                                                    rel="noopener noreferrer"
                                                    className="text-[11px] font-semibold px-2.5 py-1 rounded-md bg-slate-900 hover:bg-slate-800 text-amber-300 border border-amber-500/30 flex items-center gap-1.5 transition-colors"
                                                >
                                                    <Icon name="fa-building-columns" />
                                                    <span>Ditjen AHU Kemenkumham</span>
                                                </a>
                                                <a
                                                    href="https://oss.go.id"
                                                    target="_blank"
                                                    rel="noopener noreferrer"
                                                    className="text-[11px] font-semibold px-2.5 py-1 rounded-md bg-slate-900 hover:bg-slate-800 text-emerald-300 border border-emerald-500/30 flex items-center gap-1.5 transition-colors"
                                                >
                                                    <Icon name="fa-certificate" />
                                                    <span>Portal OSS BKPM</span>
                                                </a>
                                                <a
                                                    href="https://sikap.lkpp.go.id"
                                                    target="_blank"
                                                    rel="noopener noreferrer"
                                                    className="text-[11px] font-semibold px-2.5 py-1 rounded-md bg-slate-900 hover:bg-slate-800 text-sky-300 border border-sky-500/30 flex items-center gap-1.5 transition-colors"
                                                >
                                                    <Icon name="fa-database" />
                                                    <span>SIKaP LKPP</span>
                                                </a>
                                            </div>
                                        </div>

                                        {/* 5. Rekomendasi Tindakan PPK */}
                                        <div className="bg-sky-950/20 border border-sky-500/25 rounded-xl p-4 sm:p-5">
                                            <div className="flex items-center gap-2 text-sky-400 text-xs font-bold uppercase tracking-wider mb-2">
                                                <Icon name="fa-clipboard-check" />
                                                <span>Rekomendasi Mitigasi PPK / Pejabat Pengadaan</span>
                                            </div>
                                            <p className="text-xs sm:text-sm text-slate-200 leading-relaxed">
                                                {selectedPacket.tindakanWajib}
                                            </p>
                                        </div>

                                        {/* 6. Nota Dinas Generator */}
                                        <div className="pt-2">
                                            <div className="flex flex-wrap items-center justify-between gap-3">
                                                <button
                                                    onClick={generateNotaDinas}
                                                    className="px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-semibold text-white transition-all flex items-center gap-2"
                                                >
                                                    <Icon name="fa-file-signature" className="text-sky-400" />
                                                    <span>Susun Draf Nota Dinas & Hipotesa IP</span>
                                                </button>

                                                {notaDinasText && (
                                                    <button
                                                        onClick={() => copyToClipboard(notaDinasText, 'Draf Nota Dinas')}
                                                        className="px-4 py-2.5 rounded-xl bg-emerald-500/15 hover:bg-emerald-500/25 border border-emerald-500/30 text-xs font-semibold text-emerald-300 transition-all flex items-center gap-2"
                                                    >
                                                        <Icon name="fa-copy" />
                                                        <span>Salin Teks Nota Dinas</span>
                                                    </button>
                                                )}
                                            </div>

                                            {notaDinasText && (
                                                <textarea
                                                    readOnly
                                                    value={notaDinasText}
                                                    rows={16}
                                                    className="mt-3 w-full bg-slate-950 border border-slate-800 rounded-xl p-4 font-mono text-xs text-slate-300 leading-relaxed focus:outline-none"
                                                />
                                            )}
                                        </div>

                                    </div>
                                </div>
                            )}
                        </section>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
